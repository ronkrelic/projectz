const first=G.rooms[0],end=G.rooms.at(-1);G.p.x=back?end.x:first.x;G.p.z=back?end.z:first.z;G.path=[];G.target=null;G.intent=null;G.shots=[];G.patches=[];build();if(!G.level){prop('shrine',first.x-2,first.z,'#d4ad65');prop('stash',first.x+2,first.z,'#78532e');prop('down',first.x,first.z+3,'#382d25')}else{prop('up',first.x,first.z,'#b5ab8a');if(G.level<3)prop('down',end.x,end.z,'#382d25');G.rooms.forEach((r,i)=>{if(i%2===0)prop('sconce',r.x+1,r.z,'#b78b44')})}

document.querySelectorAll('[data-s]').forEach(b=>{let i=+b.dataset.s;b.textContent=['1 · Cinder Strike','2 · Flung Sparks','3 · Gutter-Step','4 · Steady Rite'][i]+(G.cd[i]>0?' '+G.cd[i].toFixed(1):'');b.style.opacity=G.cd[i]>.01?.55:1});}

function lightRadius(){return Math.max(.7,stats().radius*(.2+.8*G.p.flame/stats().maxFlame)-G.level*.35)}
function flameTick(dt){const s=stats(),near=G.props.some(o=>(o.lit||o.kind==='candle')&&dist(o,G.p)<2.8);let refill=!G.level?18:near?14:G.rite>0?12:s.regen;G.p.flame=clamp(G.p.flame+(refill-(G.level?1.45+G.level*.15:0)-(G.equipped.lantern?.unique?2.5:0))*dt,0,s.maxFlame);if(G.p.flame<=0&&!G.gutter){notify('GUTTERED · find a candle. The dark has teeth.');G.gutter=true}if(G.p.flame>5)G.gutter=false;
const r=lightRadius();for(const m of [...meshFloor,...walls]){let d=Math.hypot(m.position.x-G.p.x,m.position.z-G.p.z),v=!G.level?.8:Math.max(.015,1-d/r);for(const o of G.props)if(o.lit||o.kind==='candle')v=Math.max(v,.8-Math.hypot(m.position.x-o.x,m.position.z-o.z)/4);m.material.color.setRGB(1,.88,.69);if(!m.userData.own){m.material=m.material.clone();m.userData.own=true}m.material.color.setRGB(v,v*.85,v*.62)}
for(const e of G.enemies)e.sp.visible=dist(e,G.p)<r+1||G.props.some(o=>o.lit&&dist(e,o)<3);for(const d of G.drops)if(d.sp)d.sp.visible=dist(d,G.p)<r;for(const o of G.props)o.sp.material.color.set(o.lit||o.kind==='candle'?'#ffe2a4':dist(o,G.p)<r?'#b3a28c':'#161310');
if(G.notice>0){G.notice-=dt;if(G.notice<=0)$('msg').textContent=G.level?'Find the stair. Keep the flame.':'The Vestry · mend, stash, descend.'}
let names=G.enemies.filter(e=>e.hp>0&&e.sp.visible&&(e.affix||e.type==='boss'||G.hover===e));$('names').innerHTML=names.map(e=>{let v=new THREE.Vector3(e.x,2.2,e.z).project(camera);return '<div style="position:absolute;left:'+((v.x+1)*50)+'%;top:'+((1-v.y)*50)+'%;transform:translate(-50%,-100%);white-space:nowrap;color:'+(e.affix?'#d9a7eb':'#e0c793')+'">'+(e.affix?e.affix+' ':'')+(e.type==='boss'?'The Snuffed Bishop':e.type==='moth'?'Wax-moth swarm':e.type==='shamble'?'Tallow-shamble':'Grave-gnawer')+'<br><span style="display:block;background:#562018;height:4px;width:'+Math.max(0,100*e.hp/e.max)+'%"></span></div>'}).join('');}

function item(rarity='random'){if(rarity==='random'){let r=rand();rarity=r<.55?'common':r<.9?'magic':'rare'}const slots=['weapon','lantern','charm','ring'],slot=slots[Math.floor(rand()*4)],names={weapon:'Wickblade',lantern:'Ashglass Lantern',charm:'Votive Knot',ring:'Mourning Band'},it={id:Date.now()+'-'+rand(),name:names[slot],slot,rarity,mods:{}};it.mods[slot==='weapon'?'damage':slot==='lantern'?'maxFlame':slot==='charm'?'regen':'maxHp']=slot==='weapon'?3:slot==='lantern'?10:slot==='charm'?.3:8;const pool=[['damage',3,8,'Scorch'],['maxFlame',8,22,'Reserve'],['regen',.2,.9,'Patience'],['speed',.1,.6,'Haste'],['radius',.3,1.3,'Watch'],['cdr',.02,.08,'Reprise'],['maxHp',8,28,'Marrow']];let count=rarity==='magic'?1:rarity==='rare'?3:0;for(let n=0;n<count;n++){let p=pool.splice(Math.floor(rand()*pool.length),1)[0],v=p[1]+rand()*(p[2]-p[1]);it.mods[p[0]]=(it.mods[p[0]]||0)+Math.round(v*100)/100;if(!n)it.name=p[3]+' '+it.name}return it}
function unique(){return{id:'bishop-last-match',name:"the Bishop's Last Match",slot:'lantern',rarity:'unique',unique:true,mods:{radius:6,maxFlame:25}}}
function stats(){let s=baseStats();for(const it of Object.values(G.equipped))if(it)for(const[k,v]of Object.entries(it.mods))s[k]=(s[k]||0)+v;s.cdr=Math.min(.5,s.cdr);return s}
function drop(x,z,rarity){const it=typeof rarity==='object'?rarity:item(rarity),colors={common:'#cebea2',magic:'#76aaff',rare:'#e8ca54',unique:'#ee914e'};let sp=sprite('loot',colors[it.rarity]);sp.scale.set(.35,.55,1);sp.position.set(x,.25,z);let d={kind:'loot',x,z,sp,it};G.drops.push(d);return d}
function pickup(d){if(G.inv.length>=24){notify('Pack full. Return to the stash.');return}G.inv.push(d.it);world.remove(d.sp);G.drops=G.drops.filter(o=>o!==d);sound('loot',['common','magic','rare','unique'].indexOf(d.it.rarity));notify(d.it.name+' · '+d.it.rarity);effect(d.x,d.z,{common:'#c8bfa5',magic:'#7ba9e6',rare:'#e5c359',unique:'#e79052'}[d.it.rarity],.7);}
function equip(index){let it=G.inv[index];if(!it)return;G.inv.splice(index,1);if(G.equipped[it.slot])G.inv.push(G.equipped[it.slot]);G.equipped[it.slot]=it;G.p.hp=Math.min(G.p.hp,stats().maxHp);G.p.flame=Math.min(G.p.flame,stats().maxFlame);sound('loot',1);inventory();}
function describe(it){return Object.entries(it.mods).map(([k,v])=>'+'+Number(v.toFixed(2))+' '+({maxHp:'health',maxFlame:'max flame',regen:'flame/s',speed:'speed',damage:'damage',radius:'light',cdr:'cooldown reduction'}[k])).join(' · ')+(it.unique?' · burns 2.5 flame/s':'')}
function inventory(stash=false){G.stashMode=stash;$('panel').style.display='block';const s=stats();$('stats').textContent='Damage '+s.damage.toFixed(1)+' · Blood '+s.maxHp+' · Flame '+s.maxFlame+' · Regen '+s.regen.toFixed(1)+'/s · Speed '+s.speed.toFixed(1)+' · Light '+s.radius.toFixed(1)+' · Cooldowns −'+Math.round(s.cdr*100)+'%';$('gear').innerHTML='<h3>Equipped · tap to remove</h3>'+['weapon','lantern','charm','ring'].map(slot=>'<button data-u="'+slot+'" class="'+(G.equipped[slot]?.rarity||'')+'">'+slot+': '+(G.equipped[slot]?G.equipped[slot].name+'<br>'+describe(G.equipped[slot]):'empty')+'</button>').join('')+(stash?'<h3>Stash · tap pack to deposit; tap stored item to retrieve</h3>'+G.stash.map((it,i)=>'<button data-r="'+i+'" class="'+it.rarity+'">'+it.name+'<br>'+describe(it)+'</button>').join(''):'<p>Tap a pack item to equip it. Return to the chest to store items.</p>');$('items').innerHTML=Array.from({length:24},(_,i)=>{let it=G.inv[i];return '<button data-e="'+i+'" class="'+(it?.rarity||'')+'">'+(it?it.name+'<br><small>'+it.slot+' · '+describe(it)+'</small>':'·')+'</button>'}).join('');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let i=+b.dataset.e;if(!G.inv[i])return;if(stash){G.stash.push(...G.inv.splice(i,1));inventory(true)}else equip(i)});document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{let k=b.dataset.u;if(G.equipped[k]&&G.inv.length<24){G.inv.push(G.equipped[k]);delete G.equipped[k];inventory(stash)}});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(G.inv.length<24){G.inv.push(...G.stash.splice(+b.dataset.r,1));inventory(true)}});}

Object.assign(G,{item,unique,equip,inventory,drop});

function bossTick(e,dt){if(e.hp<e.max/2&&e.phase===1){e.phase=2;e.speed=1.6;notify('The Bishop breaks his seal. Wax rises.');sound('bell');for(let k=0;k<3;k++){let p=G.rooms.at(-1);spawn(k%2?'moth':'shamble',p.x+k%2,p.z+1)}}let d=dist(e,G.p);if(e.wind){e.wind.left-=dt;if(e.wind.left<=0){let w=e.wind,dx=G.p.x-e.x,dz=G.p.z-e.z,dot=(dx*w.dx+dz*w.dz)/Math.max(.01,d);if(d<(w.kind==='slam'?2.4:3.8)&&(w.kind==='slam'||dot>.05))damage(e.phase===2?36:26);effect(e.x,e.z,'#e8a15d',w.kind==='slam'?2.4:3.8,.3);e.wind=null;e.cool=e.phase===2?1.6:2.5;sound('slam')}return}if(d>1.8){if(e.think<=0){e.think=.6;e.path=pathTo(G.p.x,G.p.z,e)}if(e.path.length){let q=e.path[0],dd=dist(e,q),v=e.speed*dt;if(dd<v){e.x=q.x;e.z=q.z;e.path.shift()}else{e.x+=(q.x-e.x)/dd*v;e.z+=(q.z-e.z)/dd*v}}}if(d<5&&e.cool<=0){let kind=(e.attacks||0)%2?'sweep':'slam';e.attacks=(e.attacks||0)+1;let dx=(G.p.x-e.x)/Math.max(.01,d),dz=(G.p.z-e.z)/Math.max(.01,d);e.wind={kind,dx,dz,left:e.phase===2?.8:1.2};const r=kind==='slam'?2.4:3.8,m=effect(e.x,e.z,'#c94a32',r,e.wind.left);if(kind==='sweep'){m.geometry.dispose();m.geometry=new THREE.RingGeometry(r*.35,r,32,1,Math.atan2(-dz,dx)-Math.PI/2,Math.PI)}notify(kind==='slam'?'Bishop · SLAM — leave the red circle!':'Bishop · SWEEP — get behind him!');sound('bell')}if(e.phase===2&&G.time>(e.addAt||0)){e.addAt=G.time+10;spawn('moth',Math.round(e.x),Math.round(e.z))}}
function save(){if(!G.booted)return;try{localStorage.setItem('projectz.wickwright.v1',JSON.stringify({version:1,seed:G.seed,level:G.level,p:G.p,inventory:G.inv,equipped:G.equipped,stats:stats(),stash:G.stash,last:G.last,victory:!!G.victory}));G.saved=true}catch(e){notify('Storage unavailable · this descent will not persist.')}}
function load(){let s;try{s=JSON.parse(localStorage.getItem('projectz.wickwright.v1'))}catch(e){}if(s?.version===1){G.seed=s.seed||73191;G.inv=Array.isArray(s.inventory)?s.inventory.slice(0,24):[];G.equipped=s.equipped||{};G.stash=s.stash||[];G.last=s.last||{level:0,x:8,z:7};G.victory=!!s.victory;enter(clamp(s.level||0,0,3));if(s.p&&walkable(s.p.x,s.p.z)){G.p.x=s.p.x;G.p.z=s.p.z}G.p.hp=clamp(s.p?.hp||100,1,stats().maxHp);G.p.flame=clamp(s.p?.flame??100,0,stats().maxFlame);G.props.forEach(o=>{if(o.kind==='sconce'&&G.last.level===G.level&&dist(o,G.last)<.1)o.lit=true});notify('The wick remembers. Welcome back.')}return !!s}
function die(){let keep={...G.last};enter(keep.level);if(walkable(keep.x,keep.z)){G.p.x=keep.x;G.p.z=keep.z}G.props.forEach(o=>{if(o.kind==='sconce'&&dist(o,keep)<.1)o.lit=true});G.p.hp=stats().maxHp;G.p.flame=stats().maxFlame*.65;G.cd=[0,0,0,0];G.rite=0;G.last=keep;notify('The last sconce calls you back. Your loot is safe; the floor stirs again.');save()}
G.booted=false;load();G.booted=true;Object.assign(G,{save,load,die,hurt,damage,spawn,bossTick,flameTick,combatTick,lightRadius,interact,pickup});
</script></html>
