d="hint">Click / tap ground to walk<br>Tap a foe to pursue<br>1–4 skills · I inventory<br>Tap shrine to mend & save</div><div id="bars"><div class="seal"><i id="hp"></i><span id="hpt"></span></div><div class="seal"><i id="fl"></i><span id="flt"></span></div></div><div id="skills"><button data-s="0">1 · Cinder Strike</button><button data-s="1">2 · Flung Sparks</button><button data-s="2">3 · Gutter-Step</button><button data-s="3">4 · Steady Rite</button><button id="bag">Inventory</button></div><section id="panel"><button id="close">Close</button><h2>The Wickwright's possessions</h2><p id="stats"></p><div id="gear"></div><h3>Pack · 24 slots</h3><div id="items"></div></section><script type="module">

const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const G=window.G={level:0,seed:73191,time:0,grid:[],rooms:[],enemies:[],props:[],drops:[],fx:[],path:[],target:null,inv:[],equipped:{},stash:[],last:{level:0,x:4,z:4},p:{x:4,z:4,hp:100,flame:100},cd:[0,0,0,0],rite:0,aim:{x:5,z:4}};
let rand=Math.random;function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const scene=new THREE.Scene();scene.background=new THREE.Color('#100d0a');const camera=new THREE.OrthographicCamera(-12,12,9,-9,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);const world=new THREE.Group();scene.add(world);scene.add(new THREE.AmbientLight(0xffffff,2));let meshFloor=[],walls=[];
function texture(kind,color){const c=document.createElement('canvas');c.width=c.height=matchMedia('(pointer:coarse)').matches?64:128;const a=c.getContext('2d'),n=c.width;a.fillStyle=color;a.fillRect(0,0,n,n);for(let i=0;i<400;i++){a.fillStyle='rgba('+ (i%2?'0,0,0,':'219,185,130,')+(rand()*.16)+')';a.fillRect(rand()*n,rand()*n,rand()*12,2)}if(kind==='wall'){a.fillStyle='#8f795944';for(let i=0;i<15;i++)a.fillRect(rand()*n,0,2,rand()*n)}const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;return tx}
function sprite(kind,color){const c=document.createElement('canvas');c.width=64;c.height=96;const a=c.getContext('2d');a.fillStyle='#0008';a.beginPath();a.ellipse(32,87,22,7,0,0,7);a.fill();a.fillStyle=color;a.beginPath();if(kind==='moth'){a.moveTo(32,45);a.lineTo(2,20);a.lineTo(12,65);a.lineTo(32,55);a.lineTo(54,68);a.lineTo(63,20)}else{a.moveTo(32,20);a.lineTo(15,45);a.lineTo(8,84);a.lineTo(55,84);a.lineTo(46,45)}a.closePath();a.fill();a.fillStyle='#d9c59d';a.beginPath();a.arc(32,25,kind==='boss'?13:8,0,7);a.fill();a.fillStyle='#251d1a';a.fillRect(25,25,5,3);a.fillRect(35,25,5,3);a.strokeStyle='#b28e55';a.lineWidth=3;a.beginPath();a.moveTo(50,83);a.lineTo(50,25);a.stroke();a.fillStyle='#ffcf73';a.beginPath();a.ellipse(50,18,4,8,0,0,7);a.fill();for(let i=0;i<70;i++){a.fillStyle='#0002';a.fillRect(rand()*60,35+rand()*45,4,2)}const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));sp.scale.set(kind==='boss'?2:1.1,kind==='boss'?3:1.65,1);world.add(sp);return sp}

function walkable(x,z){return !!G.grid[Math.round(z)]?.[Math.round(x)]}
function pathTo(x,z,from=G.p){x=Math.round(x);z=Math.round(z);let sx=Math.round(from.x),sz=Math.round(from.z);if(!walkable(x,z))return[];const q=[[sx,sz]],seen=new Map([[sx+','+sz,null]]);let hit=false;for(let i=0;i<q.length;i++){const [a,b]=q[i];if(a===x&&b===z){hit=true;break}for(const [dx,dz]of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=a+dx,nz=b+dz,k=nx+','+nz;if(walkable(nx,nz)&&!seen.has(k)){seen.set(k,[a,b]);q.push([nx,nz])}}}if(!hit)return[];let out=[],v=[x,z];while(v&&(v[0]!==sx||v[1]!==sz)){out.unshift({x:v[0],z:v[1]});v=seen.get(v.join(','))}return out}

function step(dt){G.time+=dt;const s=stats();if(G.path.length){let q=G.path[0],d=dist(G.p,q),v=s.speed*dt;if(d<v){G.p.x=q.x;G.p.z=q.z;G.path.shift()}else{G.p.x+=(q.x-G.p.x)/d*v;G.p.z+=(q.z-G.p.z)/d*v}}player.position.set(G.p.x,.75+Math.sin(Math.floor(G.time*7))*.025,G.p.z);camera.position.set(G.p.x+13,17,G.p.z+13);camera.lookAt(G.p.x,0,G.p.z);$('hp').style.width=100*G.p.hp/s.maxHp+'%';$('fl').style.width=100*G.p.flame/s.maxFlame+'%';$('hpt').textContent='Blood '+Math.ceil(G.p.hp)+' / '+s.maxHp;$('flt').textContent='Flame '+Math.ceil(G.p.flame)+' / '+s.maxFlame;}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);function ground(e){mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,camera);const v=new THREE.Vector3();ray.ray.intersectPlane(plane,v);return{x:v.x,z:v.z}}
